name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # recompila a diario (por si acaso); «próximo partido» ya se calcula en el navegador

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compilar
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          # Repo «usuario.github.io» → raíz; cualquier otro nombre → /nombre-del-repo
          if [ "$REPO" = "$OWNER.github.io" ]; then BASE=""; else BASE="/$REPO"; fi
          export NEXT_PUBLIC_BASE_PATH="$BASE"
          export NEXT_PUBLIC_SITE_URL="https://${OWNER}.github.io${BASE}"
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
